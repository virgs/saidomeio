<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>saidomeio</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon48.png" alt="">
        <div>
          <h1>saidomeio</h1>
          <p>Config</p>
        </div>
      </header>

      <form id="config-form">
        <section>
          <label class="check">
            <input id="enabled" type="checkbox">
            <span>Enabled</span>
          </label>
        </section>

        <section class="current-site">
          <div>
            <span class="label">Current site</span>
            <code id="currentSite">Unavailable</code>
          </div>
          <div class="actions">
            <button id="toggleAllowCurrentSite" class="small" type="button" disabled>Add to allow list</button>
            <button id="toggleBlockCurrentSite" class="small" type="button" disabled>Add to block list</button>
          </div>
          <p class="hint">Adding a site to the allow list makes saidomeio run only on allowed sites. The block list always wins.</p>
        </section>

        <section class="grid">
          <label>
            <span>Scan interval (ms)</span>
            <input id="scanIntervalMs" type="number" min="50" step="50">
          </label>
          <label>
            <span>Scan duration (ms)</span>
            <input id="scanDurationMs" type="number" min="1000" step="500">
          </label>
        </section>

        <section>
          <div class="section-title">
            <span>Allow sites</span>
            <button id="restoreAllowSites" class="small" type="button">Use default</button>
          </div>
          <label>
            <textarea id="allowSites" spellcheck="false" placeholder="Default: all sites. Leave empty to allow every site."></textarea>
          </label>
          <div class="default-list">
            <strong>Default:</strong>
            <code id="defaultAllowSites"></code>
          </div>
          <p class="hint">Empty means all sites. Use one per line, such as <code>g1.globo.com</code>, <code>*.globo.com</code>, or <code>dailyhive.com</code>.</p>
        </section>

        <section>
          <div class="section-title">
            <span>Block sites</span>
            <button id="restoreBlockSites" class="small" type="button">Use default</button>
          </div>
          <label>
            <textarea id="blockSites" spellcheck="false" placeholder="Default: none. Leave empty to block no sites."></textarea>
          </label>
          <div class="default-list">
            <strong>Default:</strong>
            <code id="defaultBlockSites"></code>
          </div>
        </section>

        <section>
          <label>
            <span>Auto-close selectors</span>
            <textarea id="autoCloseSelectors" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>Escape selectors</span>
            <textarea id="escapeCloseSelectors" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>Auto-close text</span>
            <textarea id="autoCloseText" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>Escape text</span>
            <textarea id="escapeCloseText" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>JSON overrides</span>
            <textarea id="jsonConfig" spellcheck="false"></textarea>
          </label>
        </section>

        <footer>
          <button type="submit">Save</button>
          <button id="reset" type="button">Reset</button>
          <span id="status" role="status"></span>
        </footer>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
