<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>saidomeio</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon48.png" alt="">
        <div>
          <h1>saidomeio</h1>
          <p>Config</p>
        </div>
      </header>

      <form id="config-form">
        <section>
          <label class="check">
            <input id="enabled" type="checkbox">
            <span>Enabled</span>
          </label>
        </section>

        <section class="current-site">
          <div>
            <span class="label">Current site</span>
            <code id="currentSite">Unavailable</code>
          </div>
          <div class="actions">
            <button id="runCurrentSite" class="small" type="button" disabled>Run here</button>
            <button id="skipCurrentSite" class="small" type="button" disabled>Skip here</button>
            <button id="defaultCurrentSite" class="small" type="button" disabled>Use default</button>
          </div>
          <p class="hint" id="currentSiteRule">Current site follows the default behavior.</p>
        </section>

        <section class="grid">
          <label>
            <span>Scan interval (ms)</span>
            <input id="scanIntervalMs" type="number" min="50" step="50">
          </label>
          <label>
            <span>Scan duration (ms)</span>
            <input id="scanDurationMs" type="number" min="1000" step="500">
          </label>
        </section>

        <section class="grid">
          <label>
            <span>Default site behavior</span>
            <select id="defaultSiteAction">
              <option value="run">Run on sites by default</option>
              <option value="skip">Skip sites by default</option>
            </select>
          </label>
        </section>

        <section>
          <div class="section-title">
            <span>Site rules</span>
            <button id="restoreSiteRules" class="small" type="button">Use default</button>
          </div>
          <label>
            <textarea id="siteRules" spellcheck="false" placeholder="Default: no site-specific rules. Example:&#10;run g1.globo.com&#10;skip example.com"></textarea>
          </label>
          <div class="default-list">
            <strong>Default:</strong>
            <code id="defaultSiteRules"></code>
          </div>
          <p class="hint">Use one rule per line: <code>run g1.globo.com</code>, <code>skip *.example.com</code>. Later matching rules win.</p>
        </section>

        <section>
          <label>
            <span>Auto-close selectors</span>
            <textarea id="autoCloseSelectors" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>Escape selectors</span>
            <textarea id="escapeCloseSelectors" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>Auto-close text</span>
            <textarea id="autoCloseText" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>Escape text</span>
            <textarea id="escapeCloseText" spellcheck="false"></textarea>
          </label>
        </section>

        <section>
          <label>
            <span>JSON overrides</span>
            <textarea id="jsonConfig" spellcheck="false"></textarea>
          </label>
        </section>

        <footer>
          <button type="submit">Save</button>
          <button id="reset" type="button">Reset</button>
          <span id="status" role="status"></span>
        </footer>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
